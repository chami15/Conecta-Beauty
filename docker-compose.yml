version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: conecta-beauty-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: conecta123
      POSTGRES_DB: conecta_beauty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d conecta_beauty"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
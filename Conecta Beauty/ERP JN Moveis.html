<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>Conecta Beauty · ERP</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    /* royal blue palette */
    --bg:        #1c3a99;   /* page background (royal blue) */
    --bg-1:      #18337f;   /* slightly deeper for inputs/wells */
    --card:      #122c7a;   /* card surface — darker than page for contrast */
    --raised:    #1a368f;   /* hover/raised state */
    --hover:     #2447ad;

    /* visible borders for 3D feel */
    --line:      rgba(255,255,255,0.16);
    --line-2:    rgba(255,255,255,0.26);
    --line-3:    rgba(255,255,255,0.40);
    --edge-hi:   rgba(255,255,255,0.10); /* top inset highlight */
    --edge-lo:   rgba(0,0,0,0.30);       /* bottom inset shadow */

    /* text */
    --fg:        #ffffff;
    --fg-2:      #d6dffa;
    --fg-3:      #a5b5e0;
    --fg-4:      #7689b8;

    /* accents */
    --accent:    #ffffff;
    --accent-2:  #ffd66b;          /* warm amber — sparingly used */
    --accent-soft: rgba(255,255,255,0.10);
    --pos:       #6fe39d;
    --pos-soft:  rgba(111,227,157,0.16);
    --neg:       #ff8a8a;
    --neg-soft:  rgba(255,138,138,0.16);
    --warn:      #ffd66b;
    --warn-soft: rgba(255,214,107,0.16);

    /* type */
    --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, "JetBrains Mono", monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    background: var(--bg);
    background-attachment: fixed;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input, textarea, select { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }

  /* scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }

  /* ----- shell ----- */
  .shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 48px;
    padding: 16px 32px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky; top: 0; z-index: 50;
  }

  .brand {
    display: flex; align-items: center; gap: 12px;
    height: 32px;
  }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 6px;
    background: white;
    color: var(--bg);
    display: grid; place-items: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .brand-name {
    font-size: 14px; font-weight: 600; letter-spacing: 0.01em;
    color: var(--fg);
  }
  .brand-name .muted {
    color: var(--fg-3); font-weight: 400;
    margin-left: 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
  }

  /* top nav — plain text, bold for active */
  .topnav {
    display: flex;
    align-items: center;
    gap: 32px;
  }
  .topnav a {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--fg-3);
    padding: 4px 0;
    transition: color 150ms ease;
    cursor: pointer;
    position: relative;
  }
  .topnav a:hover { color: var(--fg-2); }
  .topnav a.active {
    color: var(--fg);
    font-weight: 700;
  }

  .topbar-spacer { flex: 1; }
  .topbar-actions { display: flex; align-items: center; gap: 12px; }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 6px;
    display: grid; place-items: center;
    color: var(--fg-3);
    border: 1px solid transparent;
    transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
  }
  .icon-btn:hover { background: var(--raised); color: var(--fg); border-color: var(--line); }
  .date-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--fg-2);
    font-size: 12px;
    font-family: var(--mono);
    background: var(--card);
    box-shadow: inset 0 1px 0 var(--edge-hi), inset 0 -1px 0 var(--edge-lo);
  }

  /* screen container */
  .screen {
    flex: 1;
    width: 100%;
  }
  /* centered container used by Início (no sidebar) */
  .screen-pad {
    padding: 28px 32px 80px;
    max-width: 1480px;
    width: 100%;
    margin: 0 auto;
  }
  .screen-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 24px;
    gap: 24px;
  }
  .screen-title {
    font-family: var(--sans);
    font-size: 24px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--fg);
  }
  .screen-eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--fg-3);
    text-transform: uppercase;
    letter-spacing: 0.20em;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .screen-sub {
    color: var(--fg-3);
    font-size: 13px;
    max-width: 540px;
    margin-top: 6px;
  }

  /* period selector */
  .period {
    display: inline-flex;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px;
    gap: 2px;
    box-shadow: inset 0 1px 0 var(--edge-hi);
  }
  .period button {
    padding: 6px 12px;
    font-size: 11px;
    color: var(--fg-3);
    border-radius: 4px;
    font-family: var(--mono);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .period button.active {
    background: var(--raised);
    color: var(--fg);
    box-shadow: inset 0 1px 0 var(--edge-hi), 0 1px 2px rgba(0,0,0,0.2);
  }
  .period button:hover:not(.active) { color: var(--fg-2); }

  /* card — visible border + inset highlight for 3D feel */
  .card {
    background: var(--card);
    border: 1px solid var(--line-2);
    border-radius: 8px;
    padding: 20px;
    position: relative;
    box-shadow:
      inset 0 1px 0 var(--edge-hi),
      inset 0 -1px 0 var(--edge-lo),
      0 1px 0 rgba(0,0,0,0.15),
      0 2px 6px rgba(0,0,0,0.10);
  }
  .card.flush { padding: 0; }
  .card-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 16px;
  }
  .card-title {
    font-size: 13px; font-weight: 600;
    color: var(--fg);
    letter-spacing: 0.01em;
  }
  .card-sub {
    font-size: 10px; color: var(--fg-3);
    font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.16em;
    margin-top: 4px;
    font-weight: 500;
  }
  .card-menu {
    color: var(--fg-4); padding: 4px;
    border-radius: 4px;
    transition: color 150ms, background 150ms;
  }
  .card-menu:hover { color: var(--fg-2); background: var(--raised); }

  /* grid helpers */
  .grid { display: grid; gap: 16px; }
  .grid-12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .grid-6  { grid-template-columns: repeat(6,  minmax(0, 1fr)); }
  .grid-4  { grid-template-columns: repeat(4,  minmax(0, 1fr)); }
  .grid-3  { grid-template-columns: repeat(3,  minmax(0, 1fr)); }
  .grid-2  { grid-template-columns: repeat(2,  minmax(0, 1fr)); }
  .col-3 { grid-column: span 3; }
  .col-4 { grid-column: span 4; }
  .col-5 { grid-column: span 5; }
  .col-6 { grid-column: span 6; }
  .col-7 { grid-column: span 7; }
  .col-8 { grid-column: span 8; }
  .col-9 { grid-column: span 9; }
  .col-12 { grid-column: span 12; }

  /* KPI */
  .kpi { display: flex; flex-direction: column; gap: 10px; }
  .kpi-label {
    font-size: 10px;
    color: var(--fg-3);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .kpi-value {
    font-family: var(--sans);
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--fg);
    line-height: 1;
    display: flex; align-items: baseline; gap: 6px;
    font-variant-numeric: tabular-nums;
  }
  .kpi-value .currency { font-size: 14px; color: var(--fg-3); font-weight: 500; }
  .kpi-value .unit { font-size: 14px; color: var(--fg-3); margin-left: 2px; font-weight: 500; }
  .kpi-foot {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; color: var(--fg-3);
    font-family: var(--mono);
  }

  .delta {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 6px 2px 4px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    line-height: 1.4;
  }
  .delta.pos { background: var(--pos-soft); color: var(--pos); }
  .delta.neg { background: var(--neg-soft); color: var(--neg); }
  .delta.neu { background: rgba(255,255,255,0.10); color: var(--fg-2); }

  /* tag / chip / pill */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 10px; color: var(--fg-2);
    font-family: var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 500;
    background: var(--bg-1);
  }
  .chip.accent { background: var(--accent-soft); border-color: var(--line-2); color: var(--fg); }
  .chip.pos { background: var(--pos-soft); border-color: rgba(111,227,157,0.35); color: var(--pos); }
  .chip.neg { background: var(--neg-soft); border-color: rgba(255,138,138,0.35); color: var(--neg); }
  .chip.warn { background: var(--warn-soft); border-color: rgba(255,214,107,0.35); color: var(--warn); }

  /* toolbar (CRUD) */
  .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px;
    background: var(--card);
    border: 1px solid var(--line-2);
    border-radius: 8px;
    margin-bottom: 16px;
    box-shadow:
      inset 0 1px 0 var(--edge-hi),
      inset 0 -1px 0 var(--edge-lo),
      0 1px 0 rgba(0,0,0,0.15);
  }
  .toolbar-search {
    flex: 1;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--fg-3);
    transition: border-color 150ms;
  }
  .toolbar-search:focus-within { border-color: var(--line-3); color: var(--fg-2); }
  .toolbar-search input {
    background: none; border: 0; outline: none;
    flex: 1; color: var(--fg);
    font-size: 13px;
  }
  .toolbar-search input::placeholder { color: var(--fg-4); }
  .toolbar-divider { width: 1px; height: 22px; background: var(--line); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    border: 1px solid var(--line);
    background: var(--bg-1);
    color: var(--fg-2);
    box-shadow: inset 0 1px 0 var(--edge-hi);
    transition: background 150ms, border-color 150ms, color 150ms;
  }
  .btn:hover { background: var(--raised); color: var(--fg); border-color: var(--line-2); }
  .btn.primary {
    background: white;
    color: var(--bg);
    border-color: white;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 1px 0 rgba(0,0,0,0.25);
    font-weight: 600;
  }
  .btn.primary:hover { background: #eef2ff; color: var(--bg); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--fg-3); box-shadow: none; }
  .btn.ghost:hover { background: var(--raised); color: var(--fg); }
  .btn.neg { color: var(--neg); border-color: rgba(255,138,138,0.35); background: var(--neg-soft); }
  .btn.neg:hover { background: rgba(255,138,138,0.22); color: var(--neg); }

  .kbd {
    font-family: var(--mono);
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--fg-3);
  }

  /* data table */
  .table {
    width: 100%; border-collapse: collapse;
    font-size: 13px;
  }
  .table th {
    text-align: left;
    padding: 11px 16px;
    font-weight: 500;
    color: var(--fg-3);
    font-size: 10px;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.16em;
    border-bottom: 1px solid var(--line);
    background: var(--bg-1);
  }
  .table th.num, .table td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
  .table td {
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
    color: var(--fg-2);
    vertical-align: middle;
  }
  .table tr:hover td { background: rgba(255,255,255,0.04); }
  .table tr.selected td { background: rgba(255,255,255,0.06); }
  .table td .row-actions { opacity: 0; transition: opacity 150ms; }
  .table tr:hover td .row-actions { opacity: 1; }
  .check {
    width: 14px; height: 14px;
    border-radius: 3px;
    border: 1px solid var(--line-3);
    background: var(--bg-1);
    display: inline-grid; place-items: center;
    cursor: pointer;
  }
  .check.on {
    background: white;
    border-color: white;
    color: var(--bg);
  }

  /* drawer */
  .drawer-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 220ms ease;
    z-index: 90;
  }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 440px; max-width: 100vw;
    background: var(--card);
    border-left: 1px solid var(--line-2);
    transform: translateX(100%);
    transition: transform 320ms cubic-bezier(.25,1,.3,1);
    z-index: 100;
    display: flex; flex-direction: column;
    box-shadow: -8px 0 24px rgba(0,0,0,0.30);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .drawer-title {
    font-family: var(--sans);
    font-size: 18px; line-height: 1.2;
    font-weight: 600;
  }
  .drawer-body { flex: 1; overflow: auto; padding: 20px 22px; }
  .drawer-foot {
    padding: 14px 22px;
    border-top: 1px solid var(--line);
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label {
    font-size: 11px;
    font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--fg-3);
  }
  .field input, .field select, .field textarea {
    padding: 9px 12px;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 13px; color: var(--fg);
    outline: none;
    transition: border-color 150ms;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent);
  }
  .field .hint { font-size: 11px; color: var(--fg-4); }

  /* sparkline + chart helpers */
  .axis-label {
    font-family: var(--mono); font-size: 10px;
    fill: var(--fg-4);
    letter-spacing: 0.08em;
  }
  .grid-line { stroke: var(--line); stroke-dasharray: 2 4; }
  .annot-text {
    font-family: var(--mono); font-size: 10px; fill: var(--fg-2);
  }

  /* sweep fade-in for screen swap */
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .screen-anim > * { animation: screenIn 360ms cubic-bezier(.2,.7,.2,1) backwards; }
  .screen-anim > *:nth-child(1) { animation-delay: 20ms; }
  .screen-anim > *:nth-child(2) { animation-delay: 50ms; }
  .screen-anim > *:nth-child(3) { animation-delay: 80ms; }
  .screen-anim > *:nth-child(4) { animation-delay: 110ms; }
  .screen-anim > *:nth-child(5) { animation-delay: 140ms; }
  .screen-anim > *:nth-child(6) { animation-delay: 170ms; }

  /* inner sidebar — full-height, sticky, not a card */
  .with-sidebar {
    display: flex;
    align-items: stretch;
    min-height: calc(100vh - 65px);
    width: 100%;
  }
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--card);
    border-right: 1px solid var(--line-2);
    box-shadow:
      inset 0 1px 0 var(--edge-hi),
      1px 0 0 rgba(0,0,0,0.10);
    position: sticky;
    top: 65px;
    align-self: flex-start;
    height: calc(100vh - 65px);
    overflow-y: auto;
    padding: 14px 10px;
    transition: width 240ms ease;
    z-index: 5;
  }
  .sidebar.collapsed { width: 60px; }
  .sidebar-toggle {
    width: 100%;
    padding: 6px 10px;
    display: flex; align-items: center; justify-content: flex-end;
    color: var(--fg-3);
    border-radius: 6px;
    margin-bottom: 12px;
  }
  .sidebar-toggle:hover { color: var(--fg); background: var(--raised); }
  .sidebar.collapsed .sidebar-toggle { justify-content: center; padding: 6px; }

  .nav-item {
    width: 100%;
    display: flex; align-items: center; gap: 12px;
    padding: 9px 12px;
    border-radius: 6px;
    color: var(--fg-3);
    font-size: 13px;
    font-weight: 400;
    text-align: left;
    transition: background 120ms, color 120ms;
  }
  .nav-item .nav-ico { color: var(--fg-3); display: grid; place-items: center; width: 16px; }
  .nav-item:hover { color: var(--fg); background: var(--raised); }
  .nav-item:hover .nav-ico { color: var(--fg); }
  .nav-item.active {
    background: var(--raised);
    color: var(--fg);
    font-weight: 700;
    box-shadow: inset 0 1px 0 var(--edge-hi);
  }
  .nav-item.active .nav-ico { color: var(--fg); }
  .nav-section {
    padding: 14px 12px 6px;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--fg-4);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-weight: 500;
  }
  .sidebar.collapsed .nav-item span.lbl,
  .sidebar.collapsed .nav-section { display: none; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: 9px 0; }

  .inner-body {
    flex: 1;
    min-width: 0;
    padding: 28px 32px 80px;
    width: 100%;
  }

  /* misc */
  .divider { height: 1px; background: var(--line); margin: 16px 0; }
  .scroll-x { overflow-x: auto; }
  .mono { font-family: var(--mono); }
  .serif-i { font-family: var(--sans); font-weight: 600; }
  .muted { color: var(--fg-3); }
  .muted-2 { color: var(--fg-4); }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.between { justify-content: space-between; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .pad-16 { padding: 16px; }
  .pad-20 { padding: 20px; }

  /* progress bar */
  .bar {
    height: 6px; border-radius: 3px;
    background: var(--bg-1);
    overflow: hidden;
    position: relative;
  }
  .bar > i {
    display: block; height: 100%;
    background: var(--accent);
    border-radius: 3px;
  }
  .bar > i.pos { background: var(--pos); }
  .bar > i.warn { background: var(--warn); }
  .bar > i.neg { background: var(--neg); }
</style>
</head>
<body>
  <div id="root"></div>
